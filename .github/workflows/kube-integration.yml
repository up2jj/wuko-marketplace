name: kube integration

on:
  pull_request:
    paths: ['plugin-src/kube/**', '.wuko/workflows/kube-*/**', '.github/workflows/kube-integration.yml']
  push:
    branches: [main]
    paths: ['plugin-src/kube/**', '.wuko/workflows/kube-*/**', '.github/workflows/kube-integration.yml']

permissions:
  contents: read

jobs:
  supervised-jobs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.35'
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: '1.36'
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: plugin-src/kube/go.sum
      - name: Install test tools
        run: |
          go install github.com/up2jj/wuko@v0.18.0
          go install sigs.k8s.io/kind@v0.33.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Race tests and static analysis
        working-directory: plugin-src/kube
        run: |
          go test -race ./...
          go vet ./...
          staticcheck ./...
      - name: Traffic, crash, environment and OTLP tests
        working-directory: plugin-src/kube
        env:
          KIND_NODE_IMAGE: ${{ matrix.image }}
        run: ./integration/run.sh
