version: 1
package_version: 0.1.0
name: kube-list
description: List retained Kubernetes executions

vars:
  namespace: "wuko-jobs"
  kubeconfig: ""
  context: ""
  label_selector: ""

outputs:
  result: {type: array, value: steps.operation.value}

steps:
  - id: operation
    type: kube.list
    with:
      namespace: "{{ .vars.namespace }}"
      kubeconfig: "{{ .vars.kubeconfig }}"
      context: "{{ .vars.context }}"
      label_selector: "{{ .vars.label_selector }}"
