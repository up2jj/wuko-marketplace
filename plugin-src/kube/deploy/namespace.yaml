apiVersion: v1
kind: Namespace
metadata:
  name: wuko-jobs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wuko-worker
  namespace: wuko-jobs
---
# The namespace is a trusted-workload boundary, not tenant isolation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wuko-worker
  namespace: wuko-jobs
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, update]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wuko-worker
  namespace: wuko-jobs
subjects:
  - kind: ServiceAccount
    name: wuko-worker
    namespace: wuko-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wuko-worker
---
# Bind this role to the human/automation identity running the plugin.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wuko-orchestrator
  namespace: wuko-jobs
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, delete]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
